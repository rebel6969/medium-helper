<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 300px; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .status { padding: 10px; border-radius: 6px; margin: 10px 0; }
        .active { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .inactive { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .toggle-on { background: #28a745; color: white; }
        .toggle-off { background: #6c757d; color: white; }
        .debug { font-size: 12px; opacity: 0.7; margin-top: 10px; }
    </style>
</head>
<body>
    <h3>📰 Medium Helper</h3>
    <div id="status" class="status inactive">Not active on Medium</div>
    <button id="toggleDebug" class="toggle-off">Enable Debug Logs</button>
    <div class="debug">Works on Medium & UX Planet paywalls</div>
    
    <script src="popup.js"></script>
</body>
</html>
